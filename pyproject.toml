[project]
name = "internet-speed-meter"
version = "1.0.0"
description = "Замер скорости интернета по скачиванию файла"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
